name: CI

# Runs on every pull request: code checks, secret scan, dependency audit,
# infrastructure checks and a Terraform plan for dev.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.17.2

jobs:
  checks:
    name: Lint, types, tests, builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Expo package versions match the SDK
        working-directory: mobile
        run: pnpm exec expo install --check
      - name: Bundle the phone app
        run: pnpm --filter @fareslip/mobile run export
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
      - name: Scan the whole history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner .'

  infra:
    name: Infrastructure checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: Validate dev and prod
        run: |
          for env in dev prod; do
            terraform -chdir="infra/envs/$env" init -backend=false -input=false
            terraform -chdir="infra/envs/$env" validate
          done
      - name: Shell check of the bootstrap script
        run: shellcheck infra/bootstrap/bootstrap.sh
      - name: Security scan of the Terraform code
        run: |
          pipx install checkov==3.4.5
          checkov --directory infra --config-file infra/.checkov.yaml

